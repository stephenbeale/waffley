name: Supabase Keep-Alive

on:
  schedule:
    # Run daily at 06:00 UTC to prevent free-tier pause (7-day inactivity limit)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://yqgrmpewmrmcajbdjaem.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" -ge 500 ]; then
            echo "::warning::Supabase returned $STATUS — project may be paused"
            exit 1
          fi
