<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chores — Recurring Task Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🧹 Chores</h1>
      <p class="subtitle">Recurring task tracker</p>
    </header>

    <section id="chore-list" aria-label="Chore list"></section>

    <button id="add-btn" aria-label="Add new chore">+</button>

    <dialog id="chore-dialog">
      <form id="chore-form" method="dialog">
        <h2 id="dialog-title">Add Chore</h2>
        <label for="chore-name">Task</label>
        <input type="text" id="chore-name" required placeholder="e.g. Vacuum the house">
        <label for="chore-interval">Recurs every (days)</label>
        <input type="number" id="chore-interval" required min="1" value="7">
        <div class="dialog-actions">
          <button type="button" id="dialog-cancel">Cancel</button>
          <button type="submit" id="dialog-save">Save</button>
        </div>
      </form>
    </dialog>
  </div>

  <script src="app.js"></script>
</body>
</html>
